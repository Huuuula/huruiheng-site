# Sveltia CMS 配置
# 文档：https://github.com/sveltia/sveltia-cms
#
# 登录走站点自己的 /auth 与 /callback（functions/ 下），不依赖 workers.dev ——
# 那个域名在境内被 DNS 污染，浏览器打不开登录弹窗。

backend:
  name: github
  repo: Huuuula/huruiheng-site
  branch: main
  # 同域 OAuth 端点；换正式域名时同步改这里
  base_url: https://huruiheng.pages.dev

# 中文界面
locale: zh_Hans

# 媒体文件进仓库 public/uploads，构建后可通过 /uploads/xxx 访问
media_folder: public/uploads
public_folder: /uploads

# 编辑时保留 frontmatter 字段顺序
slug:
  encoding: unicode
  clean_accents: false

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: src/content/posts
    create: true
    delete: true
    slug: "{{slug}}"
    preview_path: writing/{{slug}}
    summary: "{{title}} · {{date}}"
    sortable_fields: [date, title]
    fields:
      - { label: 标题, name: title, widget: string }
      - label: 日期
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
      - { label: 编号, name: no, widget: string, required: false, hint: "列表页显示为 No. 003，留空则自动生成" }
      - label: 标签
        name: tags
        widget: list
        default: []
        hint: "中文标签会生成 /tags/<编码>/ 路由"
      - { label: 摘要, name: excerpt, widget: text, required: false, hint: "列表页展示，建议 40-60 字" }
      - { label: 正文, name: body, widget: markdown }

  - name: projects
    label: 项目
    label_singular: 项目
    folder: src/content/projects
    create: true
    delete: true
    slug: "{{slug}}"
    preview_path: projects/{{slug}}
    summary: "{{title}} · {{status}}"
    fields:
      - { label: 标题, name: title, widget: string }
      - label: 日期
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
      - { label: 编号, name: no, widget: string, required: false }
      - { label: 一句话说明, name: summary, widget: text, required: false }
      - { label: 状态, name: status, widget: select, options: [进行中, 已完成, 搁置], default: 已完成 }
      - label: 技术栈
        name: stack
        widget: list
        default: []
      - { label: 年份, name: period, widget: string, required: false }
      - { label: 链接, name: link, widget: string, required: false }
      - { label: 摘要, name: excerpt, widget: text, required: false }
      - { label: 正文, name: body, widget: markdown }

  # 关于页是单文件，用 files 集合而不是 folder
  - name: pages
    label: 页面
    files:
      - name: about
        label: 关于
        file: src/content/pages/about.md
        fields:
          - { label: 标题, name: title, widget: string, default: 关于 }
          - label: 日期
            name: date
            widget: datetime
            date_format: YYYY-MM-DD
            time_format: false
            format: YYYY-MM-DD
          - { label: 摘要, name: excerpt, widget: text, required: false }
          - { label: 固定链接名, name: slug, widget: string, default: about }
          - { label: 正文, name: body, widget: markdown }

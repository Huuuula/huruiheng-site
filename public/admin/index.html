<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>内容管理 · Hu</title>
    <style>
      /* 与站点同色系，避免从站内跳到后台时视觉断裂 */
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: #faf9f5;
        color: #141413;
      }
      .boot {
        display: grid;
        place-items: center;
        gap: 12px;
        min-height: 100dvh;
        padding: 24px;
        text-align: center;
        font-size: 14px;
        color: #5e5d59;
      }
      .boot strong {
        font-family: "Source Serif 4", "Songti SC", Georgia, serif;
        font-size: 24px;
        font-weight: 400;
        color: #141413;
      }
      .boot code {
        padding: 1px 5px;
        background: #f0eee6;
        border: 1px solid rgba(20, 20, 19, 0.12);
        border-radius: 5px;
        font-size: 0.9em;
      }
      .boot a {
        color: #b5502f;
      }
    </style>
  </head>
  <body>
    <div class="boot" id="boot">
      <strong>Hu.</strong>
      <div>正在加载编辑器…</div>
      <div style="max-width: 30em; line-height: 1.7; font-size: 12px">
        如果一直停在这里，说明 CMS 的 GitHub OAuth 还没配好。<br />
        步骤见仓库里的 <code>docs/CMS.md</code>，
        或直接改 Markdown 后 <code>git push</code> 自动部署。<br />
        <a href="/">← 回站点</a>
      </div>
    </div>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  </body>
</html>
